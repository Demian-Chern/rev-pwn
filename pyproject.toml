[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctfkit"
version = "1.0.0"
description = "CTF helper for Linux ELF x86-64 (rev + pwn): triage, exploit-skeleton generation, ROP/GOT/libc/heap/shellcode helpers"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Demian-Chern" }]
keywords = ["ctf", "pwn", "reverse-engineering", "exploit", "elf", "pwntools",
            "rop", "libc", "heap", "angr", "shellcode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Demian-Chern/rev-pwn"
Repository = "https://github.com/Demian-Chern/rev-pwn"
Issues = "https://github.com/Demian-Chern/rev-pwn/issues"

# Core works with no deps (fallback mode on readelf/objdump/nm).
# Install the full experience with:  pip install "ctfkit[full]"
[project.optional-dependencies]
full = ["pwntools>=4.11"]
solve = ["angr>=9.2"]      # heavy; for the `solve` command only
dev = ["pytest>=7"]

[project.scripts]
ctfkit = "ctfkit.cli:main"

[tool.setuptools]
packages = ["ctfkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
